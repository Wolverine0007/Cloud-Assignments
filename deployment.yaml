apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-assignments
  labels:
    app: cloud-assignments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-assignments
  template:
    metadata:
      labels:
        app: cloud-assignments
    spec:
      containers:
        - name: web
          image: cloud-assignments:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
